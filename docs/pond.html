<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>池 水面面積グラフ — 杵築市</title>

  <script src="https://cdn.plot.ly/plotly-2.32.0.min.js" charset="utf-8"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;700&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Noto Sans JP", sans-serif;
      background: #f0f4f8;
      color: #1a202c;
      min-height: 100vh;
    }

    /* ── ヘッダー ── */
    .page-header {
      background: linear-gradient(135deg, #0d47a1 0%, #1976d2 100%);
      color: #fff;
      padding: 20px 32px;
      display: flex;
      align-items: center;
      gap: 20px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.2);
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      background: rgba(255,255,255,0.15);
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      font-size: 13px;
      border: 1px solid rgba(255,255,255,0.3);
      transition: background 0.2s;
      white-space: nowrap;
    }
    .back-btn:hover { background: rgba(255,255,255,0.25); }

    .header-title { flex: 1; }
    .header-title h1 { font-size: 20px; font-weight: 700; line-height: 1.3; }
    .header-title p  { font-size: 12px; margin-top: 3px; opacity: 0.8; }

    /* ── メタ情報カード ── */
    .meta-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      padding: 16px 32px;
      background: #fff;
      border-bottom: 1px solid #e2e8f0;
    }

    .meta-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: #f7fafc;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      font-size: 12px;
    }
    .meta-chip .label { color: #718096; }
    .meta-chip .value { font-weight: 700; color: #2d3748; }

    /* ── 凡例テキスト ── */
    .chart-note {
      padding: 8px 32px 0;
      font-size: 11px;
      color: #a0aec0;
    }

    /* ── グラフエリア ── */
    .chart-wrap {
      margin: 12px 24px 24px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 1px 6px rgba(0,0,0,0.08);
      padding: 8px;
      height: calc(100vh - 220px);
      min-height: 380px;
    }

    #chart { width: 100%; height: 100%; }

    /* ── データなし ── */
    #no-data {
      display: none;
      align-items: center;
      justify-content: center;
      height: 100%;
      font-size: 14px;
      color: #a0aec0;
    }

    @media (max-width: 600px) {
      .page-header { padding: 14px 16px; }
      .meta-bar    { padding: 12px 16px; }
      .chart-wrap  { margin: 8px 10px 16px; height: calc(100vh - 240px); }
      .chart-note  { padding-left: 16px; }
    }
  </style>
</head>
<body>

<header class="page-header">
  <a class="back-btn" href="index.html">← 地図へ戻る</a>
  <div class="header-title">
    <h1 id="pond-name">読み込み中...</h1>
    <p>杵築市 池水面面積モニタリング — Sentinel-1 SAR（降交軌道）</p>
  </div>
</header>

<div class="meta-bar" id="meta-bar">
  <!-- JS で生成 -->
</div>

<p class="chart-note">※ 撮影日ごとの実測値をプロット（Sentinel-1 SAR 降交軌道）　／　ha = 水面面積（㎡）÷ 10,000</p>

<div class="chart-wrap">
  <div id="chart"></div>
  <div id="no-data">この池の観測データがまだありません</div>
</div>

<script src="assets/chart.js"></script>
</body>
</html>
