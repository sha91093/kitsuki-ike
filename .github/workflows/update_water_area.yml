name: 水面面積データ更新

on:
  schedule:
    - cron: '0 3 * * 1,4'  # 月・木 03:00 UTC（Sentinel-1の概ねの周期）
  workflow_dispatch:
    inputs:
      days_back:
        description: '何日前まで遡って取得するか（初回過去データ取得時は 730 を指定）'
        required: false
        default: '14'
        type: string
      orbits:
        description: '取得する軌道'
        required: false
        default: 'descending,ascending'
        type: choice
        options:
          - 'descending,ascending'
          - 'descending'
          - 'ascending'
      pond_ids:
        description: '対象池を simple_id のカンマ区切りで限定（試験導入用。空欄なら全池）'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存ライブラリをインストール
        run: pip install -r requirements.txt

      - name: GEE サービスアカウント認証ファイルを配置
        run: echo '${{ secrets.GEE_SERVICE_ACCOUNT_KEY }}' > /tmp/gee_key.json

      - name: Sentinel-1 データ取得・水面面積算出
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gee_key.json
          # 入力値はシェルに直接展開せず環境変数経由で渡す
          DAYS_BACK: ${{ github.event.inputs.days_back || '14' }}
          ORBITS: ${{ github.event.inputs.orbits || 'descending,ascending' }}
          POND_IDS: ${{ github.event.inputs.pond_ids }}
        run: |
          ARGS=(--days-back "$DAYS_BACK" --orbits "$ORBITS")
          if [ -n "$POND_IDS" ]; then
            ARGS+=(--pond-ids "$POND_IDS")
          fi
          echo "実行: python scripts/fetch_sentinel1.py ${ARGS[*]}"
          python scripts/fetch_sentinel1.py "${ARGS[@]}"

      - name: データ集計・data.json 生成
        run: python scripts/aggregate_data.py

      - name: 変更をコミット＆プッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/data.json
          git diff --staged --quiet || git commit -m "Update water area data $(date -u +%Y-%m-%d)"
          git push
